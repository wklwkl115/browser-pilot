pre-commit:
  commands:
    sync-protocol:
      glob: "bridge/native_command_schema.json"
      run: npm run sync:protocol && git add bridge/pi_browser_bridge/native_command_schema.json bridge_src/service_worker/protocol.ts src/protocol/nativeProtocol.ts src/protocol/nativeActionMetadata.ts src/protocol/nativeErrorCodes.ts docs/generated/native-protocol.generated.md
    sync-capture:
      glob: "capture-src/**/*"
      run: npm run sync:capture && git add src/capture/generated
    # ESLint on staged sources. Ratcheted debt rules now block regressions.
    # Loads type info, so expect a few seconds — move to a pre-push hook if it drags on commits.
    lint:
      glob: "*.{ts,js,mjs,cjs}"
      run: npx eslint --no-warn-ignored {staged_files}

min_version = "2024.1.0"

# mise only pins the Node version; every task delegates to the npm scripts in package.json,
# which remain the single source of truth for CI and contributors without mise.

[tools]
node = "22"

[tasks.test]
description = "Run the deterministic Node test suite (npm test)"
run = "npm test"

[tasks.verify]
description = "Run the complete quality gate (npm run verify)"
run = "npm run verify"

[tasks.test-mcp]
description = "Run foundation + command + daemon + MCP tests"
run = "node scripts/run-tests.mjs mcp"

[tasks.test-observe]
description = "Run foundation + observe tests"
run = "node scripts/run-tests.mjs observe"

[tasks.smoke-browser]
description = "Launch Chrome/Edge and verify the core browser workflow (npm run smoke:browser)"
run = "npm run smoke:browser"

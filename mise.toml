min_version = "2024.1.0"

[tools]
node = "22"

[tasks.test]
description = "Run deterministic Node tests for all bootstrap and refactor scopes"
run = "npm test"

[tasks.verify]
description = "Run the complete deterministic quality gate"
run = "npm run verify"

[tasks.test-mcp]
description = "Run bootstrap + MCP tests"
run = "node scripts/run-tests.mjs mcp"

[tasks.test-observe]
description = "Run bootstrap + canonical observe tests"
run = "node scripts/run-tests.mjs observe"

[tasks.smoke-browser]
description = "Launch Chrome/Edge and verify the core browser workflow"
run = "npm run smoke:browser"

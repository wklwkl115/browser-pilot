<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Intercept Response Fixture</title>
</head>
<body>
  <main>
    <h1>Intercept Response Fixture</h1>
    <p id="status" data-state="idle">Status: idle</p>
    <button id="load-data" type="button">Load fixture data</button>
    <pre id="output">none</pre>
  </main>
  <script>
    document.getElementById('load-data').addEventListener('click', async () => {
      const res = await fetch('/api/intercept-data', { headers: { 'X-Fixture': 'response' } });
      const text = await res.text();
      document.getElementById('status').dataset.state = 'loaded';
      document.getElementById('status').textContent = 'Status: loaded';
      document.getElementById('output').textContent = text;
    });
  </script>
</body>
</html>

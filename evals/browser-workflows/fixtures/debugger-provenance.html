<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Debugger Provenance Fixture</title>
  <script src="./debugger/provenance-helper.js"></script>
</head>
<body>
  <main>
    <h1>Debugger Provenance Fixture</h1>
    <p id="status" data-state="idle">Status: idle</p>
    <button id="run-provenance" type="button">Run provenance</button>
  </main>
  <script>
    document.getElementById('run-provenance').addEventListener('click', () => {
      const status = document.getElementById('status');
      const payload = window.provenanceHelper && window.provenanceHelper.makePayload
        ? window.provenanceHelper.makePayload('delta')
        : { branch: 'missing-helper' };
      window.__PROVENANCE_LAST__ = payload;
      status.dataset.state = payload.branch;
      status.textContent = 'Status: ' + payload.branch + ' ' + payload.tokenLength;
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OOPIF child fixture</title>
</head>
<body>
  <main>
    <h2>Cross-origin child fixture</h2>
    <button id="child-action" data-oopif-child="action">Child action</button>
  </main>
  <script>
    document.getElementById("child-action").addEventListener("click", () => {
      parent.postMessage({ type: "oopif-child-clicked" }, "*");
    });
  </script>
</body>
</html>

<!doctype html>
<meta charset="utf-8">
<title>jshook canvas fixture</title>
<main>
  <h1>Canvas fixture</h1>
  <canvas id="scene" width="240" height="120" aria-label="Synthetic canvas scene"></canvas>
  <script type="application/json" id="scene-metadata">{
    "objects": [
      { "id": "box-1", "type": "rect", "x": 20, "y": 20, "width": 80, "height": 40, "fill": "#3366ff" },
      { "id": "label-1", "type": "text", "x": 30, "y": 85, "text": "PI" }
    ]
  }</script>
</main>
<script>
(function () {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const metadata = JSON.parse(document.getElementById('scene-metadata').textContent);
  window.__piCanvasFixture = metadata;
  ctx.fillStyle = '#f5f5f5';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = metadata.objects[0].fill;
  ctx.fillRect(metadata.objects[0].x, metadata.objects[0].y, metadata.objects[0].width, metadata.objects[0].height);
  ctx.fillStyle = '#111111';
  ctx.font = '20px sans-serif';
  ctx.fillText(metadata.objects[1].text, metadata.objects[1].x, metadata.objects[1].y);
})();
</script>

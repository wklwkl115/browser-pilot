<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Network Fixture</title>
</head>
<body>
  <main>
    <h1>Network Fixture</h1>
    <button id="load" type="button">Load echo data</button>
    <pre id="result">No request yet</pre>
  </main>
  <script>
    document.getElementById('load').addEventListener('click', async () => {
      const response = await fetch('/api/echo?item=browser-workflow', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-fixture': 'network-eval' },
        body: JSON.stringify({ action: 'capture', value: 7 })
      });
      document.getElementById('result').textContent = await response.text();
    });
  </script>
</body>
</html>

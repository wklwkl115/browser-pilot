<!doctype html>
<meta charset="utf-8">
<title>jshook replay fixture</title>
<main>
  <h1>Replay fixture</h1>
  <button id="send-request">Send request</button>
  <pre id="response">idle</pre>
</main>
<script>
(function () {
  const output = document.getElementById('response');
  document.getElementById('send-request').addEventListener('click', async () => {
    const response = await fetch('/api/jshook/replay?item=fixture', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-pi-fixture': 'original'
      },
      body: JSON.stringify({ item: 'fixture', quantity: 1 })
    });
    output.textContent = await response.text();
  });
})();
</script>

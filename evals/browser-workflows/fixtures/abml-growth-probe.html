<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ABML growth probe fixture</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    main { padding: 24px; }
    #virtual-list {
      position: relative;
      width: 520px;
      height: 240px;
      overflow-y: auto;
      border: 1px solid #333;
      background: #fff;
    }
    .spacer { height: 2400px; }
    .row {
      position: absolute;
      left: 0;
      right: 0;
      height: 32px;
      padding: 6px 12px;
      box-sizing: border-box;
      border-bottom: 1px solid #ddd;
      background: #f8fafc;
    }
  </style>
</head>
<body>
  <main>
    <h1>Virtualized results</h1>
    <section id="virtual-list" role="list" aria-label="Virtualized results">
      <div class="spacer" aria-hidden="true"></div>
      <div class="row" role="listitem"></div>
      <div class="row" role="listitem"></div>
      <div class="row" role="listitem"></div>
      <div class="row" role="listitem"></div>
      <div class="row" role="listitem"></div>
      <div class="row" role="listitem"></div>
      <div class="row" role="listitem"></div>
      <div class="row" role="listitem"></div>
    </section>
  </main>
  <script>
    const list = document.getElementById("virtual-list");
    const rows = Array.from(list.querySelectorAll(".row"));
    function render() {
      const first = Math.max(0, Math.floor(list.scrollTop / 32));
      rows.forEach((row, index) => {
        const item = first + index + 1;
        row.style.transform = `translateY(${first * 32 + index * 32}px)`;
        row.textContent = `Result ${item} - deterministic virtual row`;
      });
    }
    list.addEventListener("scroll", render, { passive: true });
    render();
    window.__abmlGrowthFixture = {
      state() {
        return {
          scrollTop: list.scrollTop,
          rowCount: rows.length,
          firstText: rows[0].textContent,
          lastText: rows[rows.length - 1].textContent,
          scrollHeight: list.scrollHeight,
          clientHeight: list.clientHeight
        };
      }
    };
  </script>
</body>
</html>

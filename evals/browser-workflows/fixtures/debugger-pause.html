<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Debugger Pause Fixture</title>
</head>
<body>
  <main>
    <h1>Debugger Pause Fixture</h1>
    <p id="status" data-state="running">Ticks: 0</p>
    <button id="stop-counter" type="button">Stop counter</button>
  </main>
  <script>
    let count = 0;
    const status = document.getElementById('status');
    const timer = setInterval(() => {
      count += 1;
      status.textContent = 'Ticks: ' + count;
      status.dataset.count = String(count);
    }, 250);
    document.getElementById('stop-counter').addEventListener('click', () => {
      clearInterval(timer);
      status.dataset.state = 'stopped';
      status.textContent = 'Ticks stopped at ' + count;
    });
  </script>
</body>
</html>

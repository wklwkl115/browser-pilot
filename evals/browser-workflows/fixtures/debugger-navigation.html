<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Debugger Navigation Fixture</title>
</head>
<body>
  <main>
    <h1>Debugger Navigation Fixture</h1>
    <p id="status" data-state="page-a">Status: page-a</p>
    <a id="nav-next" href="?page=b">Navigate next</a>
    <button id="reload-page" type="button">Reload page</button>
  </main>
  <script>
    const url = new URL(location.href);
    const page = url.searchParams.get('page') || 'a';
    const status = document.getElementById('status');
    status.dataset.state = page === 'b' ? 'page-b' : 'page-a';
    status.textContent = 'Status: ' + status.dataset.state;
    document.getElementById('reload-page').addEventListener('click', () => location.reload());
  </script>
</body>
</html>

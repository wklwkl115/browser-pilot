<!doctype html>
<meta charset="utf-8">
<title>jshook runtime sinks fixture</title>
<main>
  <h1>Runtime sinks fixture</h1>
  <button id="run-sinks">Run deterministic sinks</button>
  <output id="status">idle</output>
  <section id="sink-target"></section>
</main>
<script>
(function () {
  const status = document.getElementById('status');
  const target = document.getElementById('sink-target');
  window.__fixtureEvents = [];
  function record(type, detail) {
    window.__fixtureEvents.push({ type, detail, at: Date.now() });
  }
  document.getElementById('run-sinks').addEventListener('click', () => {
    record('eval', eval('"eval-result"'));
    const fn = new Function('value', 'return "function-" + value;');
    record('function', fn('result'));
    setTimeout('window.__fixtureEvents.push({ type: "timer-string", detail: "timeout", at: Date.now() })', 0);
    localStorage.setItem('pi-jshook-local', 'fixture-local-value');
    sessionStorage.setItem('pi-jshook-session', 'fixture-session-value');
    window.postMessage({ fixture: 'postMessage', value: 7 }, '*');
    target.insertAdjacentHTML('beforeend', '<p data-fixture="dom-sink">DOM sink fixture</p>');
    try {
      const ws = new WebSocket('ws://127.0.0.1:9/pi-jshook-fixture');
      ws.addEventListener('error', () => record('websocket-error', 'expected-local-failure'));
      record('websocket-constructor', 'attempted');
    } catch (error) {
      record('websocket-constructor-error', error.name || 'error');
    }
    status.textContent = 'done';
  });
})();
</script>

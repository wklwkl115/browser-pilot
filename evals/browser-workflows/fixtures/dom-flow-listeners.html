<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DOM Flow Listener Fixture</title>
</head>
<body>
  <main>
    <button id="pay">Pay now</button>
    <div id="sink"></div>
  </main>
  <script>
    function onPay() {
      document.getElementById('sink').innerHTML = '<span>paid</span>';
    }
    document.getElementById('pay').addEventListener('click', onPay, { passive: true });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Interactive Fixture</title>
</head>
<body>
  <main>
    <h1>Interactive Fixture</h1>
    <p id="status" data-state="idle">Status: idle</p>
    <button id="activate" type="button" aria-controls="activation-popup" aria-expanded="false">Activate workflow</button>
  </main>
  <script>
    document.getElementById('activate').addEventListener('click', () => {
      const status = document.getElementById('status');
      status.dataset.state = 'activated';
      status.textContent = 'Status: activated';
      const button = document.getElementById('activate');
      button.setAttribute('aria-expanded', 'true');
      let popup = document.getElementById('activation-popup');
      if (!popup) {
        popup = document.createElement('div');
        popup.id = 'activation-popup';
        popup.setAttribute('role', 'listbox');
        popup.setAttribute('aria-label', 'Activation choices');
        for (const label of ['Confirm activation', 'Review activation']) {
          const option = document.createElement('div');
          option.setAttribute('role', 'option');
          option.textContent = label;
          popup.appendChild(option);
        }
        document.querySelector('main').appendChild(popup);
      }
    });
  </script>
</body>
</html>

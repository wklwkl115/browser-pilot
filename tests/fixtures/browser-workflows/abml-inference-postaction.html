<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ABML inference + post-action fixture</title>
</head>
<body>
  <nav aria-label="Main">
    <a href="/" aria-current="page">Home</a>
    <a href="/docs">Docs</a>
    <a href="/pricing">Pricing</a>
  </nav>

  <main>
    <!-- login: a real submit must win over federated + passkey (de-overfit check).
         aria-label mirrors the visible text so the scan's accessible name is realistic
         (a bare text-only <button> with no aria-label/class yields an empty name). -->
    <form aria-label="Sign in">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="off">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="off">
      <button type="submit" aria-label="Sign in">Sign in</button>
      <button id="oauth" type="button" aria-label="Sign in with Google">Sign in with Google</button>
      <a id="passkey" href="#" aria-label="Sign in with a passkey">Sign in with a passkey</a>
      <a id="forgot" href="#" aria-label="Forgot your password?">Forgot your password?</a>
      <!-- disabled control for the form-dependency check; an action enables it -->
      <button id="apply" type="button" aria-label="Apply settings" disabled>Apply settings</button>
    </form>

    <!-- filter/facet panel: real filter controls -> filter-panel high -->
    <section aria-label="Filters">
      <button type="button" aria-label="Filter by Brand">Filter by Brand</button>
      <button type="button" aria-label="Price range">Price range</button>
      <button type="button" aria-label="Customer rating">Customer rating</button>
      <button type="button" aria-label="Department">Department</button>
    </section>

    <!-- hidden dialog: must NOT fire while hidden (visibility gating) -->
    <div id="dlg" role="dialog" aria-label="Confirm delete" hidden>Are you sure?</div>

    <!-- empty container; an action will inject a role=alert toast into it -->
    <div id="region"></div>
  </main>
</body>
</html>

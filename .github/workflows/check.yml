name: check

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node + install + build
        uses: ./.github/actions/setup-node-build

      - name: Verify public package
        run: npm run check

      - name: Upload package verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-package-artifacts
          path: .pi/browser-artifacts/public-package/**
          if-no-files-found: ignore

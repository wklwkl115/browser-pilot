name: check

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node + install + build
        uses: ./.github/actions/setup-node-build

      - name: Verify public package
        run: npm run check

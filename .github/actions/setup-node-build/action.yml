name: setup-node-build
description: Checkout-independent local setup for Pi browser tools CI jobs
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Build outer dist
      shell: bash
      run: npm run build

    - name: Build bridge dist
      shell: bash
      run: npm run build:bridge

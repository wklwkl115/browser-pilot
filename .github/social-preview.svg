<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Glow orb top-right -->
  <circle cx="1050" cy="150" r="250" fill="url(#glow)"/>
  <!-- Glow orb bottom-left -->
  <circle cx="230" cy="500" r="200" fill="url(#glow)"/>

  <!-- Browser window mockup (left side) -->
  <g transform="translate(80, 160)">
    <!-- Window frame -->
    <rect x="0" y="0" width="400" height="300" rx="12" fill="#1a1a2e" stroke="#334155" stroke-width="1.5"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="400" height="36" rx="12" fill="#0f1629"/>
    <rect x="0" y="24" width="400" height="12" fill="#0f1629"/>
    <!-- Traffic lights -->
    <circle cx="20" cy="18" r="6" fill="#ef4444" opacity="0.9"/>
    <circle cx="40" cy="18" r="6" fill="#eab308" opacity="0.9"/>
    <circle cx="60" cy="18" r="6" fill="#22c55e" opacity="0.9"/>
    <!-- URL bar -->
    <rect x="85" y="8" width="230" height="20" rx="4" fill="#1e293b"/>
    <text x="100" y="22" font-family="monospace" font-size="11" fill="#64748b">linux.do/t/welcome</text>

    <!-- Terminal content -->
    <text x="16" y="60" font-family="monospace" font-size="12" fill="#6366f1">$</text>
    <text x="28" y="60" font-family="monospace" font-size="12" fill="#e2e8f0"> browser-pilot observe</text>
    <text x="16" y="82" font-family="monospace" font-size="11" fill="#22c55e">  gist:</text>
    <text x="60" y="82" font-family="monospace" font-size="11" fill="#94a3b8"> "Forum topic list,</text>
    <text x="60" y="98" font-family="monospace" font-size="11" fill="#94a3b8">  14 rows, 47 actions"</text>

    <text x="16" y="126" font-family="monospace" font-size="12" fill="#6366f1">$</text>
    <text x="28" y="126" font-family="monospace" font-size="12" fill="#e2e8f0"> browser-pilot execute</text>
    <text x="16" y="148" font-family="monospace" font-size="11" fill="#94a3b8">  document.querySelector(</text>
    <text x="16" y="164" font-family="monospace" font-size="11" fill="#fbbf24">    '.topic-list a'</text>
    <text x="16" y="180" font-family="monospace" font-size="11" fill="#94a3b8">  ).click()</text>

    <text x="16" y="208" font-family="monospace" font-size="12" fill="#6366f1">$</text>
    <text x="28" y="208" font-family="monospace" font-size="12" fill="#e2e8f0"> browser-pilot network</text>
    <text x="16" y="230" font-family="monospace" font-size="11" fill="#22c55e">  requests:</text>
    <text x="80" y="230" font-family="monospace" font-size="11" fill="#94a3b8"> 12 captured</text>
    <text x="16" y="246" font-family="monospace" font-size="11" fill="#22c55e">  cookies:</text>
    <text x="80" y="246" font-family="monospace" font-size="11" fill="#94a3b8"> 8 analyzed</text>

    <!-- Cursor blink -->
    <rect x="16" y="264" width="8" height="14" rx="1" fill="#6366f1" opacity="0.8"/>
  </g>

  <!-- Right side: Title and description -->
  <g transform="translate(560, 120)">
    <!-- Project name -->
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="white" letter-spacing="-2">Browser Pilot</text>

    <!-- Accent line -->
    <rect x="0" y="20" width="120" height="4" rx="2" fill="url(#accent)"/>

    <!-- Tagline -->
    <text x="0" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8">Give your AI agent a real browser.</text>
    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#94a3b8">Not a screenshot.</text>

    <!-- Feature pills -->
    <g transform="translate(0, 130)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="155" height="36" rx="18" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.7"/>
      <text x="78" y="23" font-family="system-ui, sans-serif" font-size="14" fill="#60a5fa" text-anchor="middle" font-weight="600">22 browser_* tools</text>

      <rect x="170" y="0" width="160" height="36" rx="18" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7"/>
      <text x="250" y="23" font-family="system-ui, sans-serif" font-size="14" fill="#a78bfa" text-anchor="middle" font-weight="600">Semantic DOM</text>

      <rect x="345" y="0" width="145" height="36" rx="18" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.7"/>
      <text x="418" y="23" font-family="system-ui, sans-serif" font-size="14" fill="#4ade80" text-anchor="middle" font-weight="600">860+ tests</text>

      <!-- Row 2 -->
      <rect x="0" y="50" width="175" height="36" rx="18" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.7"/>
      <text x="88" y="73" font-family="system-ui, sans-serif" font-size="14" fill="#fbbf24" text-anchor="middle" font-weight="600">7 security tools</text>

      <rect x="190" y="50" width="170" height="36" rx="18" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
      <text x="275" y="73" font-family="system-ui, sans-serif" font-size="14" fill="#22d3ee" text-anchor="middle" font-weight="600">Token-efficient</text>

      <rect x="375" y="50" width="145" height="36" rx="18" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.7"/>
      <text x="448" y="73" font-family="system-ui, sans-serif" font-size="14" fill="#f472b6" text-anchor="middle" font-weight="600">CDP physical</text>
    </g>

    <!-- Architecture hint -->
    <g transform="translate(0, 270)">
      <text x="0" y="0" font-family="monospace" font-size="13" fill="#475569">Chrome Extension</text>
      <text x="140" y="0" font-family="monospace" font-size="13" fill="#334155"> ─── WebSocket ──▸ </text>
      <text x="340" y="0" font-family="monospace" font-size="13" fill="#475569">Node.js Bridge</text>
      <text x="460" y="0" font-family="monospace" font-size="13" fill="#334155"> ──▸ </text>
      <text x="495" y="0" font-family="monospace" font-size="13" fill="#475569">Tools</text>
    </g>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="610" width="1280" height="30" fill="#0f172a" opacity="0.6"/>
  <text x="640" y="630" font-family="system-ui, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Apache-2.0  ·  TypeScript  ·  Node.js 22+  ·  Chrome / Edge</text>
</svg>

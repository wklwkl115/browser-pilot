<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0a0e1a;
    --text: #e7ecf5;
    --muted: #8b95a7;
    --card: rgba(255, 255, 255, 0.045);
    --card-border: rgba(255, 255, 255, 0.09);
    --accent: #8593a8;
    --glow: rgba(133, 147, 168, 0.16);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 300px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  /* Blurred color field behind the glass; its tint follows the connection state. */
  .bg {
    position: fixed;
    inset: -45%;
    z-index: 0;
    background:
      radial-gradient(38% 42% at 28% 18%, var(--glow), transparent 70%),
      radial-gradient(42% 44% at 78% 82%, rgba(99, 102, 241, 0.14), transparent 72%);
    filter: blur(34px);
    transition: background 0.6s ease;
  }
  .card {
    position: relative;
    z-index: 1;
    margin: 14px;
    padding: 18px 18px 16px;
    border-radius: 18px;
    background: var(--card);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.07);
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }
  header .logo { width: 18px; height: 18px; border-radius: 5px; opacity: 0.95; }
  header .brand { font-size: 13px; font-weight: 600; letter-spacing: 0.2px; }
  header .ver {
    margin-left: auto;
    font: 500 10px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--muted);
    padding: 3px 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.07);
    white-space: nowrap;
  }
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 6px 0 14px;
  }
  .dot {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent), 0 0 18px var(--accent);
    transition: background 0.45s ease, box-shadow 0.45s ease;
  }
  body[data-state="connected"] .dot { animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 26%, transparent), 0 0 12px var(--accent); }
    50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--accent) 0%, transparent), 0 0 24px var(--accent); }
  }
  .status {
    font-size: 19px;
    font-weight: 650;
    letter-spacing: 0.3px;
    transition: color 0.3s ease;
  }
  .endpoint {
    text-align: center;
    font: 600 12.5px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--text);
    padding: 7px 0;
    margin: 0 auto 4px;
    width: fit-content;
    min-width: 130px;
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.07);
    padding-left: 12px;
    padding-right: 12px;
  }
  .endpoint.hidden { display: none; }
  .meta {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin: 8px 0 16px;
    min-height: 14px;
    line-height: 1.4;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 9px 0;
    border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--card-border));
    border-radius: 10px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.08s ease;
  }
  .btn:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
  .btn:active { transform: scale(0.985); }
  .btn[disabled] { opacity: 0.55; cursor: default; }

  body[data-state="connected"]    { --accent: #34d399; --glow: rgba(52, 211, 153, 0.28); }
  body[data-state="disconnected"] { --accent: #fb7185; --glow: rgba(251, 113, 133, 0.22); }
  body[data-state="offline"]      { --accent: #8593a8; --glow: rgba(133, 147, 168, 0.16); }
  body[data-state="connecting"]   { --accent: #fbbf24; --glow: rgba(251, 191, 36, 0.24); }
  body[data-state="consent-pending"] { --accent: #a78bfa; --glow: rgba(167, 139, 250, 0.26); }

  body[data-state="connected"] .status    { color: #6ee7b7; }
  body[data-state="disconnected"] .status { color: #fda4af; }
  body[data-state="connecting"] .status   { color: #fcd34d; }
  body[data-state="consent-pending"] .status { color: #c4b5fd; }

  /* ── Consent-pending state: hide normal status hero, show consent section ── */
  body[data-state="consent-pending"] .hero    { display: none; }
  body[data-state="consent-pending"] .endpoint { display: none !important; }
  body[data-state="consent-pending"] .meta    { display: none; }
  body[data-state="consent-pending"] #action  { display: none; }

  /* Consent section — visible only when data-state="consent-pending" */
  #consent-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 6px 0 4px;
  }
  /* Always hide when not in consent-pending state, regardless of hidden attr */
  body:not([data-state="consent-pending"]) #consent-section { display: none !important; }

  .consent-title {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 2px;
  }
  .consent-agent-label {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    text-align: center;
    word-break: break-all;
  }
  .consent-code-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    width: 100%;
    margin: 4px 0 2px;
  }
  .consent-code {
    font: 700 28px/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: 6px;
    color: #c4b5fd;
    background: rgba(167, 139, 250, 0.10);
    border: 1px solid rgba(167, 139, 250, 0.28);
    border-radius: 10px;
    padding: 10px 18px;
    text-align: center;
  }
  .consent-hint {
    font-size: 10.5px;
    color: var(--muted);
    text-align: center;
    line-height: 1.4;
  }
  .consent-actions {
    display: flex;
    gap: 8px;
    width: 100%;
    margin-top: 4px;
  }
  .consent-actions .btn {
    flex: 1;
  }
  .btn-approve {
    border-color: rgba(52, 211, 153, 0.45);
    background: rgba(52, 211, 153, 0.12);
    color: #6ee7b7;
  }
  .btn-approve:hover {
    background: rgba(52, 211, 153, 0.22);
    border-color: rgba(52, 211, 153, 0.65);
  }
  .btn-deny {
    border-color: rgba(251, 113, 133, 0.40);
    background: rgba(251, 113, 133, 0.10);
    color: #fda4af;
  }
  .btn-deny:hover {
    background: rgba(251, 113, 133, 0.20);
    border-color: rgba(251, 113, 133, 0.60);
  }

  /* ── Agents collapsible section ── */
  #agents-list {
    margin-top: 12px;
    border-top: 1px solid var(--card-border);
    padding-top: 10px;
  }
  #agents-list[hidden] { display: none; }

  #agents-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    color: var(--muted);
    font: 600 11px/1 inherit;
    letter-spacing: 0.3px;
    text-align: left;
    margin-bottom: 0;
  }
  #agents-toggle:hover { color: var(--text); }
  .agents-chevron {
    display: inline-block;
    width: 10px;
    text-align: center;
    transition: transform 0.2s ease;
    font-style: normal;
  }
  #agents-toggle[data-open="true"] .agents-chevron { transform: rotate(90deg); }

  #agents-body {
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.25s ease;
  }
  #agents-list[data-open="true"] #agents-body {
    max-height: 300px;
  }

  .agents-empty {
    font-size: 11px;
    color: var(--muted);
    padding: 8px 0 4px;
    text-align: center;
  }
  .agent-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }
  .agent-row:last-child { border-bottom: none; }
  .agent-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .agent-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 160px;
  }
  .agent-status {
    font-size: 10.5px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .lease-badge {
    display: inline-block;
    font-size: 9px;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 999px;
    background: rgba(251, 191, 36, 0.15);
    border: 1px solid rgba(251, 191, 36, 0.35);
    color: #fcd34d;
    white-space: nowrap;
  }
  .agent-lastseen {
    font-size: 9.5px;
    color: rgba(139, 149, 167, 0.6);
  }
  .btn-sm {
    display: inline-block;
    width: auto;
    padding: 4px 10px;
    font-size: 11px;
    border-radius: 7px;
    flex-shrink: 0;
  }
  .btn-revoke {
    border-color: rgba(251, 113, 133, 0.35);
    background: rgba(251, 113, 133, 0.08);
    color: #fda4af;
  }
  .btn-revoke:hover {
    background: rgba(251, 113, 133, 0.18);
    border-color: rgba(251, 113, 133, 0.55);
  }

  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none !important; }
    .bg, .status, .btn { transition: none; }
    #agents-body { transition: none; }
    .agents-chevron { transition: none; }
  }
</style>
</head>
<body data-state="connecting">
<div class="bg" id="bg"></div>
<main class="card">
  <header>
    <img class="logo" src="logo-32.png" alt="">
    <span class="brand">Browser Pilot Bridge</span>
    <span class="ver" id="ver">—</span>
  </header>

  <!-- Normal connection-status hero (hidden when consent-pending) -->
  <div class="hero">
    <span class="dot"></span>
    <span class="status" id="status">检查中…</span>
  </div>
  <div class="endpoint hidden" id="endpoint"></div>
  <div class="meta" id="meta">正在读取连接状态</div>
  <button class="btn" id="action">刷新</button>

  <!-- Consent-pending section (shown only in consent-pending state) -->
  <div id="consent-section" hidden>
    <div class="consent-title">配对请求</div>
    <div class="consent-agent-label" id="consent-label"></div>
    <div class="consent-code-wrap">
      <div class="consent-code" id="consent-code"></div>
      <div class="consent-hint">确认此代码与终端显示一致</div>
    </div>
    <div class="consent-actions">
      <button class="btn btn-approve" id="consent-approve">批准</button>
      <button class="btn btn-deny" id="consent-deny">拒绝</button>
    </div>
  </div>

  <!-- Paired agents collapsible section -->
  <div id="agents-list" hidden>
    <button id="agents-toggle" data-open="false">
      <i class="agents-chevron">›</i>
      已配对 Agent
    </button>
    <div id="agents-body">
      <div class="agents-empty">暂无</div>
    </div>
  </div>
</main>
<script src="popup.js"></script>
</body>
</html>
